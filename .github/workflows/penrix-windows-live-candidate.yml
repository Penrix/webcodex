name: Penrix Windows live candidate

on:
  pull_request:
    paths:
      - "integrations/penrix_chatgpt_web/**"
      - ".github/workflows/penrix-windows-live-candidate.yml"

concurrency:
  group: penrix-live-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: penrix-live-candidate-win64
      - name: Build exact WebCodex runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:WEBCODEX_BUILT_AT = (git show -s --format=%ct HEAD).Trim()
          cargo build --locked --profile dogfood -p webcodex -p webcodex-cli -p webcodex-runner
          if ($LASTEXITCODE -ne 0) { throw "WebCodex runtime build failed" }
          foreach ($name in @("webcodex", "webcodex-server", "webcodex-runner")) {
            $binary = Join-Path "target\dogfood" "$name.exe"
            if (-not (Test-Path -LiteralPath $binary)) { throw "Missing $binary" }
            $version = (& $binary --version | Select-Object -First 1).Trim()
            if ($LASTEXITCODE -ne 0) { throw "$name --version failed" }
            if ($version -notmatch ("^" + [regex]::Escape($name) + " 0\.4\.4 ")) {
              throw "Unexpected $name version: $version"
            }
          }
      - name: Observe Microsoft Defender on exact binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($null -eq $status -or -not $status.AMServiceEnabled -or -not $status.AntivirusEnabled) {
            "Microsoft Defender runtime scan: UNVERIFIED on this hosted runner (engine unavailable or disabled)." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }
          foreach ($name in @("webcodex.exe", "webcodex-server.exe", "webcodex-runner.exe")) {
            $target = (Resolve-Path (Join-Path "target\dogfood" $name)).Path
            Start-MpScan -ScanType CustomScan -ScanPath $target
            if (-not (Test-Path -LiteralPath $target)) {
              throw "Microsoft Defender removed or quarantined $name"
            }
            $escaped = [regex]::Escape($target)
            $hit = Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Where-Object { ($_.Resources -join [Environment]::NewLine) -match $escaped } |
              Select-Object -First 1
            if ($null -ne $hit) {
              throw "Microsoft Defender reported a detection for $name"
            }
          }
          "Microsoft Defender runtime scan: PASS for all three exact candidate executables." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Probe real Windows share lifecycle
        shell: pwsh
        run: |
          python integrations/penrix_chatgpt_web/live_acceptance.py --share-probe-only --webcodex-bin-dir target/dogfood
          if ($LASTEXITCODE -ne 0) { throw "Windows share probe failed" }
      - name: Stage live candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = Join-Path $env:RUNNER_TEMP "penrix-webcodex-live-candidate"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage "integrations\penrix_chatgpt_web") | Out-Null
          Copy-Item target\dogfood\webcodex.exe $stage
          Copy-Item target\dogfood\webcodex-server.exe $stage
          Copy-Item target\dogfood\webcodex-runner.exe $stage
          Copy-Item integrations\penrix_chatgpt_web\driver.py (Join-Path $stage "integrations\penrix_chatgpt_web")
          Copy-Item integrations\penrix_chatgpt_web\live_acceptance.py (Join-Path $stage "integrations\penrix_chatgpt_web")
          Copy-Item integrations\penrix_chatgpt_web\README.md (Join-Path $stage "integrations\penrix_chatgpt_web")
          @(
            "source_sha=$((git rev-parse HEAD).Trim())"
            "source_short=$((git rev-parse --short=12 HEAD).Trim())"
            "built_at=$((git show -s --format=%ct HEAD).Trim())"
            "platform=windows-latest-x64"
          ) | Set-Content -LiteralPath (Join-Path $stage "SOURCE.txt") -Encoding utf8
          "CANDIDATE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Upload exact Windows live candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: penrix-webcodex-live-candidate-win32-x64-${{ github.event.pull_request.head.sha }}
          path: ${{ env.CANDIDATE_DIR }}
          if-no-files-found: error
          retention-days: 7
